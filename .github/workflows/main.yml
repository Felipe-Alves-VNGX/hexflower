name: Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi

      - name: Check tag doesn't exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ inputs.version }}$"; then
            echo "Error: Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Update module.json
        run: |
          # Update version
          sed -i 's/"version": "[^"]*"/"version": "${{ inputs.version }}"/' module.json

          # Update download URL
          sed -i 's|"download": "[^"]*"|"download": "https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/module.zip"|' module.json

          # Verify changes
          echo "Updated module.json:"
          grep -E '"version"|"download"' module.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "Release v${{ inputs.version }}"

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ inputs.version }}"

      - name: Create Zip Archive
        # Zip the dist folder, styles, templates, etc.
        # We need to structure the zip so it unzips into the module folder.
        # Usually Foundry modules zip the CONTENT of the module folder.
        # But we are building to 'dist'.
        # We should create a temp directory, copy module.json, dist/, styles/, templates/ lang/ into it, then zip THAT.
        run: |
          mkdir package
          cp module.json package/
          cp -r dist package/
          cp -r styles package/
          cp -r templates package/
          cp -r languages package/ 2>/dev/null || :
          cp -r assets package/ 2>/dev/null || :
          cp README.md package/
          cd package
          zip -r ../module.zip .

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ inputs.version }}"
          name: "Release v${{ inputs.version }}"
          body: "${{ inputs.release_notes }}"
          artifacts: "module.json,module.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
